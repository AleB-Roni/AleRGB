name: Release

# Baut den Windows-Installer und veröffentlicht ihn als GitHub-Release.
# Läuft bei jedem Push auf main: Existiert für die Version aus package.json
# noch kein Release (z.B. v1.0.0), wird es gebaut und veröffentlicht.
# Neue Version = "version" in package.json erhöhen und pushen.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION existiert bereits – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Installer bauen
        run: npx electron-builder --win nsis --publish never

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AleRGB ${{ needs.check.outputs.version }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/AleRGB-Setup-*.exe
            dist/AleRGB-Setup-*.exe.blockmap
            dist/latest.yml
