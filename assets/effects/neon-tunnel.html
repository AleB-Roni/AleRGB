<!DOCTYPE html>
<html>
<head>
  <title>Neon-Tunnel</title>
  <meta description="Leuchtende Ringe rasen auf dich zu – reagiert optional auf Bass.">
  <meta publisher="AleRGB">
  <meta property="speed" label="Geschwindigkeit" type="number" min="1" max="20" default="8">
  <meta property="rings" label="Ringe" type="number" min="4" max="24" default="12">
  <meta property="hueShift" label="Farbverschiebung" type="hue" min="0" max="360" default="280">
  <meta property="audioReact" label="Auf Musik reagieren" type="boolean" default="0">
</head>
<body style="margin:0;background:#000">
<canvas id="exCanvas" width="320" height="200"></canvas>
<script>
const ctx = document.getElementById('exCanvas').getContext('2d');
let t = 0;
function frame() {
  let boost = 1;
  if (audioReact) { const f = engine.audio.freq; let b = 0; for (let i = 0; i < 16; i++) b += f[i]; boost = 1 + (b / (16 * 255)) * 3; }
  t += (speed / 600) * boost;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, 320, 200);
  const n = Math.round(rings);
  for (let i = 0; i < n; i++) {
    const z = ((i / n + t) % 1);
    const r = Math.pow(z, 2.4) * 260;
    const hue = (hueShift + i * (360 / n) + t * 60) % 360;
    ctx.strokeStyle = 'hsl(' + hue + ',100%,' + (30 + z * 35) + '%)';
    ctx.lineWidth = 2 + z * 14;
    ctx.beginPath(); ctx.ellipse(160 + Math.sin(t * 2) * 20 * (1 - z), 100 + Math.cos(t * 1.5) * 10 * (1 - z), r, r * 0.7, 0, 0, Math.PI * 2); ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
