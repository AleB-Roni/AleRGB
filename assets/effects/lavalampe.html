<!DOCTYPE html>
<html>
<head>
  <title>Lavalampe</title>
  <meta description="Weiche, verschmelzende Blasen wie in einer Lavalampe (Metaballs).">
  <meta publisher="Spectra RGB">
  <meta property="speed" label="Geschwindigkeit" type="number" min="1" max="20" default="5">
  <meta property="blobs" label="Anzahl Blasen" type="number" min="2" max="10" default="6">
  <meta property="colorA" label="Lava-Farbe" type="color" default="#ff2d75">
  <meta property="colorB" label="Glüh-Farbe" type="color" default="#ffb800">
  <meta property="bg" label="Hintergrund" type="color" default="#12002b">
</head>
<body style="margin:0;background:#000">
<canvas id="exCanvas" width="320" height="200"></canvas>
<script>
const W = 80, H = 50; // intern niedrige Auflösung → schnell
const c = document.getElementById('exCanvas'), ctx = c.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bx = buf.getContext('2d');
const img = bx.createImageData(W, H);
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16));
let t = 0;
function frame() {
  t += speed / 900;
  const A = hex(colorA), B = hex(colorB), G = hex(bg), n = Math.round(blobs);
  const bl = [];
  for (let i = 0; i < n; i++) bl.push([W / 2 + Math.sin(t * (0.7 + i * 0.13) + i * 2.1) * W * 0.38, H / 2 + Math.cos(t * (0.5 + i * 0.17) + i * 1.3) * H * 0.42, 6 + (i % 3) * 3]);
  const d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = 0; for (const b of bl) { const dx = x - b[0], dy = y - b[1]; v += (b[2] * b[2]) / (dx * dx + dy * dy + 1); }
    const k = (y * W + x) * 4;
    const inside = Math.min(1, Math.max(0, (v - 0.8) * 2.5)), glow = Math.min(1, v * 0.6);
    for (let ch = 0; ch < 3; ch++) d[k + ch] = G[ch] * (1 - glow) + (A[ch] * inside + B[ch] * (1 - inside)) * glow;
    d[k + 3] = 255;
  }
  bx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(buf, 0, 0, 320, 200);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
